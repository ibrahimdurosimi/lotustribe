<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A31D1D" />
      <stop offset="100%" stop-color="#6E0F0F" />
    </linearGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FCE7E7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <g filter="url(#softShadow)" transform="translate(256, 270)">
    <!-- Base Lotus Pedestal / Crescent -->
    <path d="M -130,50 Q 0,110 130,50 Q 70,80 0,82 Q -70,80 -130,50 Z" fill="url(#petalGrad)" opacity="0.95" />

    <!-- Outer Left Petal -->
    <path d="M 0,40 C -80,45 -150,-10 -160,-90 C -120,-75 -50,-10 0,40 Z" fill="url(#petalGrad)" opacity="0.9" />

    <!-- Outer Right Petal -->
    <path d="M 0,40 C 80,45 150,-10 160,-90 C 120,-75 50,-10 0,40 Z" fill="url(#petalGrad)" opacity="0.9" />

    <!-- Mid Left Petal -->
    <path d="M 0,35 C -55,30 -115,-40 -105,-135 C -65,-95 -20,-30 0,35 Z" fill="url(#petalGrad)" opacity="0.95" />

    <!-- Mid Right Petal -->
    <path d="M 0,35 C 55,30 115,-40 105,-135 C 65,-95 20,-30 0,35 Z" fill="url(#petalGrad)" opacity="0.95" />

    <!-- Central Majestic Petal -->
    <path d="M 0,30 C -45,0 -50,-110 0,-175 C 50,-110 45,0 0,30 Z" fill="url(#petalGrad)" />

    <!-- Center Golden Glow Heart -->
    <circle cx="0" cy="10" r="22" fill="url(#goldGrad)" />
    <circle cx="0" cy="10" r="14" fill="#FEF08A" />
  </g>
</svg>
